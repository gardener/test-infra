---
apiVersion: v1
kind: Secret
metadata:
  name: tm-configuration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "defaultLabels" . | nindent 4 }}
type: Opaque
data:
  config.yaml: {{ include "config" . | b64enc | trim }}
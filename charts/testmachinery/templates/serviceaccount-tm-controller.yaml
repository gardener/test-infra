---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required ".Values.controller.serviceAccountName is required" .Values.controller.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "defaultLabels" . | nindent 4 }}
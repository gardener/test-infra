kind: TestDefinition
metadata:
  name: secret-config-testdef
spec:
  owner: dummy@mail.com

  description: Tests mounting of configurations from secrets.

  config:
  - name: TEST_NAME
    type: env
    valueFrom:
      secretKeyRef:
        name: test-secret
        key: test

  labels: ["tm-integration-secret"]

  command: [bash, -c]
  args: ["./test/.test-defs/scripts/check-env"]